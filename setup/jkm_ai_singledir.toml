[spreadsheet]
format = "csv" # Only format currently supported
#filename = "Z:/juhis_previews_set2_TEST/juhis_isot2_ai_data_raw.csv"
filename = "/home/kahanpaa/projects/_videostill/ai_data_raw.csv"
write_raw_output  = true

[data] # Which file type identifies a record?
main_data_directory = "/home/kahanpaa/projects/_videostill/"
#main_data_directory = "Z:/juhis_previews_set2_TEST/"
datatype_to_load = "SINGLEFILE" # CURRENTLY AVAILABLE OPTIONS = MZH_INSECTLINE, MZH_PLANTLINE, SINGLEFILE
recognize_by_filename_pattern = ["*.jpg"] # List - Trigger file filename pattern(s) that leads to a sample processing event
label_file = "Preview002.jpg" # Files with this name pattern are treated as files with labels
object_files = ["Preview001.jpg"] # Files with this name pattern are treated as files with specimens (if both match, treated as combined)
label_title = "specimens_and_labels" # Written into metadata only
object_titles = ["habitus1"] # Written into metadata only

[task]
# FILE AND DIRECTORY NAMING AND MOVING TASKS
# All are true of false
create_directories = false               
files_rename_by_barcode_id = false       
directories_rename_by_barcode_id = false 
### IMAGE EDITING TASKS
image_editing_tasks = true              
# DATA EXTRACTION TASKS
read_barcodes = true               
# Find areas with text using cv2 computer vision
find_text_areas = false                  
save_text_area_images = false            
ocr = false                              
ocr_analysis = false                     
# LABEL DATA EXTRACTION TASKS
ai_label_text_extraction = true          
labeldata_to_CSV = true                  
# OTHER DATA
save_JSON = false                        
write_postprocessor_report_file = false

# IMAGE CHANGE TASKS
[task.image]
rotate_images = false
crop_images = true

[task.image.rotate]
degrees = 180
## rotation, clockwise, in degrees, allowed values  = 0, 90, 180 or 270
#save_rotated = false

[task.image.crop.1]
target = "specimen"  # string - specimen, label, or all
method = "fixed"     # string - only fixed currently supported
min_w = 100          # integer - pixel value 
max_w = 1000         # integer - pixel value or inf for image edge
#min_h = 0           # integer - pixel value 
#min_h = 2000        # integer - pixel value or inf for image edge

[ai]
model = "gemini-3.5-flash-lite"
prompt = "These images are all of the same object. Find text in the images. Reply with JSON, fitting the data into the variables specified in the JSON Schema given."
max_image_dim = 1200 # integer - maximum image size. Pass 0 or comment out for no scaling
properties_filename = "" # String - leave empty for no output
# Authentication to Google Cloud services
auth_type = "APIKEY" # APIKEY, LOCAL_OAUTH or CLOUD_OAUTH
# Settings for API KEY auth
APIkeyfile = "/home/kahanpaa/GEMINI_APIKEY"
#APIkeyfile = "Z:/APIKEYS/GEMINI_APIKEY.txt"
# Google Cloud API settings (LOCAL_OAUTH and CLOUD_OAUTH)
google_location = "global"
google_project_id = "gen-lang-client-0404401598"
# Settings LOCAL_OAUTH: OAUTH2 authentication without Google's Gcloud tool
app_token_path = "Z:/ADC/jkm_token.json" # Should be readable
tmp_token_path = "Z:/ADC/temptoken.json" # Should be writeable

[meta]
copyright_owner = "Luomus" # Written into JSON metadata files only
operator = "Luomus digitoijat" # Written into JSON metadata files only
textline = "" # Written into JSON metadata files only
# license = ""  # Written into JSON metadata files only

[postprocessor]
# Having BOTH monitor and process_existing as true is asking for trouble...
monitor = false # true of false
process_existing = true # true of false
sleep_after_new_sample_detected = 1 # integer - Allows for enough time for transfer of a file(s)  to be completed
sleep_before_renaming = 0 # integer, seconds - Wait before directory renaming to make sure other processes have time to complete.
filename_timestamp_format = "%Y%m%d_%Hh%Mm%Ss"

# Setting for the barcode recognition tool
[barcodes]
increase_contrast = true # true of false - if true, will increase contrast before barcode recognition attempt
grey_range = 50 # integer - CHECK MEANING
secondary_from_ocr = false # true of false - Attempt reading specimen ID from the image if barcode was not found (or readable)
barcodepackage = "pyzbar" # qreader or pyzbar - Python qr package used
# TODO: barcode type list

# Setting for the OCR tool
#[ocr]
# OCR engine program location
#ocr_command = "C:/Program Files/Tesseract-OCR/tesseract.exe"
# Known data items file. Should be UTF-8 encoded
#known_data_items_files = ["testdata/east_fenn_person_patterns.csv", "testdata/east_fenn_place_patterns.csv"]
#excluded_strings_file = "testdata/excluded_strings.csv"
#EASTfile = "C:/Insect_APPs/EAST/frozen_east_text_detection.pb" ## path to the neural net file used for Text area detection
#tesseract_timeout = 5 # integer - timeout (in seconds) for the main OCR process
#lang = "eng" ## Language(s), multiple languages can be given like thi = eng+swe. For the supported range see documentation of Tesseract. Defaults to eng.


