#edge_value = 220 # Value at the edge of the area (typically 0-255)
#min_area = 1 # Minimum area of object in percent of whole image area
#m_width = 400 # integer - width of image used in processing (smaller = faster, but less accurate)
#search_for_dark = true # false or true - Search for dark objects (False for light objects)
#crop_padding_factor = 1.3 # Float number - ## NOT IMPLEMENTED - Check
